<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3A96FF"/>
      <stop offset="1" stop-color="#1B76F0"/>
    </linearGradient>
    <radialGradient id="fur" cx="0.42" cy="0.30" r="0.75">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#F4F7FC"/>
      <stop offset="1" stop-color="#C9D6EA"/>
    </radialGradient>
    <radialGradient id="ear" cx="0.4" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CFDAEC"/>
    </radialGradient>
    <radialGradient id="eye" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#7A4A2C"/>
      <stop offset="0.6" stop-color="#3E2314"/>
      <stop offset="1" stop-color="#1E0E07"/>
    </radialGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E4ECF8"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="badgeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0A3F8F" flood-opacity="0.35"/>
    </filter>
    <clipPath id="squircle">
      <path d="M0 230C0 60 60 0 230 0h52c170 0 230 60 230 230v52c0 170-60 230-230 230h-52C60 512 0 452 0 282z"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- bear shadow on the background -->
    <ellipse cx="190" cy="430" rx="250" ry="150" fill="#0B4FB5" opacity="0.35" filter="url(#soft)"/>

    <!-- ears -->
    <circle cx="112" cy="238" r="52" fill="url(#ear)"/>
    <circle cx="332" cy="238" r="46" fill="url(#ear)"/>

    <!-- head: peeking in from the bottom, as in the main icon -->
    <path d="M-30 560 C-30 330 70 232 222 232 C370 232 470 330 470 560 Z" fill="url(#fur)"/>

    <!-- eyes -->
    <circle cx="150" cy="372" r="52" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="300" cy="420" r="52" fill="#FFFFFF" opacity="0.9"/>
    <circle cx="156" cy="376" r="38" fill="url(#eye)"/>
    <circle cx="306" cy="424" r="38" fill="url(#eye)"/>
    <circle cx="172" cy="360" r="12" fill="#FFFFFF"/>
    <circle cx="322" cy="408" r="12" fill="#FFFFFF"/>
    <circle cx="146" cy="392" r="5" fill="#FFFFFF" opacity="0.8"/>
    <circle cx="296" cy="440" r="5" fill="#FFFFFF" opacity="0.8"/>

    <!-- smile -->
    <path d="M214 428 Q236 452 262 436" fill="none" stroke="#2A160C" stroke-width="9" stroke-linecap="round"/>

    <!-- runner badge: a play triangle in a white squircle, top right -->
    <g filter="url(#badgeShadow)">
      <path d="M332 48 C332 24 344 12 368 12 h72 c24 0 36 12 36 36 v72 c0 24 -12 36 -36 36 h-72 c-24 0 -36 -12 -36 -36 z" fill="url(#badge)"/>
    </g>
    <path d="M384 56 L440 84 L384 112 Z" fill="#2084FD" stroke="#2084FD" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
