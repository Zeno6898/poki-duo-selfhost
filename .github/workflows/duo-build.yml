# Builds the Poki iPhone app (native/ios-app) as an unsigned IPA with its Live Activity widget, runs it
# on the iOS Simulator, and takes a screenshot of every screen in light and dark mode. It is signed when
# it is installed (see native/ios-app/README.md).
name: Duo self-hosted iOS app

on:
  workflow_dispatch:
  push:
    branches: [duo/selfhost]
    paths: [.github/workflows/duo-build.yml]

permissions:
  contents: read

jobs:
  tests:
    runs-on: macos-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fa05a26f4a479e218a9a78b290f13bd391d4c609

      - name: Apply the reviewed self-hosted build changes
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/duo-selfhost.patch" <<'DUO_PATCH'
          diff --git a/.github/workflows/ios-app.yml b/.github/workflows/ios-app.yml
          index 7b0b7ad..d5b970b 100644
          --- a/.github/workflows/ios-app.yml
          +++ b/.github/workflows/ios-app.yml
          @@ -6,7 +6,7 @@ name: iOS app
