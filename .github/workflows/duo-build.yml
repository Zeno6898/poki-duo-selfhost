          +/// Opens a fresh authenticated developer tunnel without starting or stopping a runner.
          +/// Blocking (at most 15 seconds): the app calls this on a background thread.
          +#[unsafe(no_mangle)]
          +pub unsafe extern "C" fn poki_remote_probe(config_json: *const c_char) -> *mut c_char {
          +    let value = match unsafe { read_str(config_json) } {
          +        Some(text) => runtime().block_on(remote_probe(&text)),
          +        None => serde_json::json!({"ok": false, "address": "", "stage": "config", "detail": "missing configuration"}),
          +    };
          +    CString::new(value.to_string()).expect("JSON contains no literal NUL").into_raw()
          +}
          +
          +async fn remote_probe(text: &str) -> Value {
          +    #[derive(serde::Deserialize)]
          +    struct ProbeConfig { address: std::net::IpAddr, pairing_file: std::path::PathBuf }
          +    let config: ProbeConfig = match serde_json::from_str(text) {
          +        Ok(config) => config,
          +        Err(_) => return serde_json::json!({"ok": false, "address": "", "stage": "config", "detail": "invalid configuration"}),
          +    };
          +    let address = config.address.to_string();
          +    let fail = |stage: &str, detail: String| serde_json::json!({"ok": false, "address": address, "stage": stage, "detail": detail});
          +    // Diagnostic targets are fixed local endpoints; never send pairing credentials to a remote host.
          +    if !config.address.is_loopback() && config.address != std::net::IpAddr::from([10, 7, 0, 1]) {
          +        return fail("config", "only loopback or 10.7.0.1 is allowed".into());
          +    }
          +    let (mut pairing, host) = match remote::read_pairing_file(&config.pairing_file, Some("Poki")) {
          +        Ok(value) => value,
          +        Err(_) => return fail("pairing_file", "the remote pairing file could not be read".into()),
          +    };
          +    let step = std::sync::Mutex::new(String::from("remote pairing connect"));
          +    let result = tokio::time::timeout(std::time::Duration::from_secs(15),
          +        remote::connect(config.address, &mut pairing, &host, |stage| *step.lock().unwrap() = stage.into())
          +    ).await;
          +    match result {
          +        // The new test connection is dropped here. The existing launcher's Device is untouched.
          +        Ok(Ok(_connection)) => serde_json::json!({"ok": true, "address": address, "stage": "RSD verified", "detail": "pair-verify, TLS tunnel and RSD handshake succeeded"}),
          +        Ok(Err(error)) => fail(&format!("{:?}", error.stage), error.detail),
          +        Err(_) => fail(&step.lock().unwrap(), "diagnostic timed out after 15 seconds".into()),
          +    }
          +}
