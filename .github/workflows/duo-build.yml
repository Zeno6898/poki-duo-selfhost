# Public upstream 0.2.3 plus the reviewed three-file self-host/signing patch.
name: Duo self-hosted iOS app

on:
  workflow_dispatch:
  push:
    branches: [duo/selfhost]
    paths: [.github/workflows/duo-build.yml]

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JosssphZhou/poki
          ref: c74303af522e4e496f1fc7b764f1157fb0b80d11

      - name: Apply only the relay and signing compatibility changes
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/selfhost.patch" <<'SELFHOST_PATCH'
          diff --git a/native/ios-app/Poki/Connect/RelayIdentity.swift b/native/ios-app/Poki/Connect/RelayIdentity.swift
          index b0c2212..36599bf 100644
          --- a/native/ios-app/Poki/Connect/RelayIdentity.swift
          +++ b/native/ios-app/Poki/Connect/RelayIdentity.swift
          @@ -16,7 +16,7 @@ struct ConnectorSecret: Codable, Identifiable, Hashable {
           @MainActor
           @Observable
           final class RelayIdentity {
          -    static let relayBase = URL(string: "https://pokimcp.zheha.nz/v1")!
          +    static let relayBase = URL(string: "https://poki-duo-20261107.poki-cf-relay.workers.dev/v1")!
               private static let keyAccount = "relay.ed25519"
               private static let secretsAccount = "relay.secrets"
           
          diff --git a/native/ios-app/Poki/Runtime/LiveCore.swift b/native/ios-app/Poki/Runtime/LiveCore.swift
          index baff194..4a8c802 100644
          --- a/native/ios-app/Poki/Runtime/LiveCore.swift
          +++ b/native/ios-app/Poki/Runtime/LiveCore.swift
          @@ -15,7 +15,10 @@ final class LiveCore: CoreSession {
           
               init(host: AppCoreHost) {
                   self.host = host
          -        core = PokiCore(config: CoreConfig(), host: host)
          +        core = PokiCore(config: CoreConfig(
          +            relayURL: URL(string: "wss://poki-duo-20261107.poki-cf-relay.workers.dev/v1")!,
          +            ownBundleID: Bundle.main.bundleIdentifier ?? "nz.zheha.poki"
          +        ), host: host)
                   (events, continuation) = AsyncStream.makeStream(bufferingPolicy: .bufferingNewest(64))
                   let continuation = self.continuation
                   pump = Task { [core] in
          diff --git a/native/ios-app/Shared/PokiActivityAttributes.swift b/native/ios-app/Shared/PokiActivityAttributes.swift
          index 63eecaf..1926c27 100644
          --- a/native/ios-app/Shared/PokiActivityAttributes.swift
          +++ b/native/ios-app/Shared/PokiActivityAttributes.swift
          @@ -70,7 +70,19 @@ struct PendingApproval: Codable, Hashable {
           }
           
           enum SharedContainer {
          -    static let appGroup = "group.nz.zheha.poki"
          +    // Signing tools rewrite App Group IDs; the app and widget must use their granted group.
          +    static let appGroup: String = {
          +        let original = "group.nz.zheha.poki"
          +        guard let profileURL = Bundle.main.url(forResource: "embedded", withExtension: "mobileprovision"),
          +              let profile = try? Data(contentsOf: profileURL),
          +              let start = profile.range(of: Data("<plist".utf8)),
          +              let end = profile.range(of: Data("</plist>".utf8), in: start.lowerBound..<profile.endIndex),
          +              let plist = try? PropertyListSerialization.propertyList(from: profile.subdata(in: start.lowerBound..<end.upperBound), format: nil) as? [String: Any],
          +              let entitlements = plist["Entitlements"] as? [String: Any],
          +              let groups = entitlements["com.apple.security.application-groups"] as? [String]
          +        else { return original }
          +        return groups.first { $0 == original || $0.hasPrefix(original + ".") } ?? original
          +    }()
               static var url: URL? { FileManager.default.containerURL(forSecurityApplicationGroupIdentifier: appGroup) }
               static var thumbnailURL: URL? { url?.appendingPathComponent("activity-thumbnail.jpg") }
               static var defaults: UserDefaults { UserDefaults(suiteName: appGroup) ?? .standard }
          SELFHOST_PATCH
          echo "25566db404a7d4d82700845718171b454924b1950bd611f5bd8b67312df0121a  $RUNNER_TEMP/selfhost.patch" | shasum -a 256 -c -
          git apply --check "$RUNNER_TEMP/selfhost.patch"
          git apply "$RUNNER_TEMP/selfhost.patch"
          git diff --check
          git diff --stat

      - name: Use the newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: PokiLauncher (Rust static library for the phone)
        run: |
          set -euo pipefail
          # idevice at the pinned revision, with Poki's patch (run_over_rsd), as bin/setup fetches it.
          git clone -q https://github.com/jkcoxson/idevice.git .deps/idevice
          git -C .deps/idevice checkout -q --detach 89702099f4d7552f704f93b4526756abda319ceb
          git -C .deps/idevice apply ../../native/patches/idevice-xctest-run-over-rsd.patch
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-apple-ios aarch64-apple-ios-sim
          for n in 2 3 4; do sudo ifconfig lo0 alias "127.0.0.$n" up; done
          cargo test --release --locked --manifest-path native/launcher/Cargo.toml
          cargo build --release --locked --target aarch64-apple-ios --manifest-path native/launcher/Cargo.toml
          cargo build --release --locked --target aarch64-apple-ios-sim --manifest-path native/launcher/Cargo.toml
          ls -la native/launcher/target/aarch64-apple-ios/release/libpoki_launcher.a
          # The C ABI's symbols, for the log (the app's link step is the real check).
          (nm -g native/launcher/target/aarch64-apple-ios/release/libpoki_launcher.a 2>/dev/null | grep -E '_poki_(launcher|pair|string)_' | sort -u) || echo "nm listed no poki_ symbols"

      - name: PokiCore tests
        timeout-minutes: 12
        run: swift test --package-path native/ios/PokiCore

      - name: Developer disk image mirror answers
        run: |
          # The files PokiCore's DeveloperDiskImage.ensure downloads on the phone.
          for f in BuildManifest.plist Image.dmg Image.dmg.trustcache Image.dmg.cryptex_info Image.dmg.root_hash; do
            code=$(curl -sL -o /dev/null -w '%{http_code}' "https://raw.githubusercontent.com/doronz88/DeveloperDiskImage/main/PersonalizedImages/Xcode_iOS_DDI_Cryptex/$f")
            echo "$f $code"; test "$code" = 200
          done

      - name: Assets and project
        run: |
          native/ios-app/scripts/make-assets.sh
          brew install xcodegen
          xcodegen generate --spec native/ios-app/project.yml

      - name: Version (from the release tag, else native/ios-app/VERSION and this run's number)
        run: |
          VERSION="0.2.3"; BUILD="5"
          [ -n "$VERSION" ] || VERSION=$(cat native/ios-app/VERSION)
          [ -n "$BUILD" ] || BUILD="${{ github.run_number }}"
          echo "MARKETING_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "CURRENT_PROJECT_VERSION=$BUILD" >> "$GITHUB_ENV"
          echo "Poki $VERSION ($BUILD)"

      - name: Build (iOS device SDK, unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build \
            -project native/ios-app/Poki.xcodeproj \
            -scheme Poki -configuration Release \
            -destination generic/platform=iOS \
            -derivedDataPath build/app \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" \
            ARCHS=arm64 | tee build/app.log
          test -d build/app/Build/Products/Release-iphoneos/Poki.app

      - name: Package the IPA
        run: |
          set -euo pipefail
          APP=build/app/Build/Products/Release-iphoneos/Poki.app
          test ! -e "$APP/PlugIns/PokiTunnel.appex"
          test -d "$APP/PlugIns/PokiWidgets.appex"
          rm -rf Payload out && mkdir -p Payload out
          ditto "$APP" Payload/Poki.app
          find Payload -name '*.dSYM' -prune -exec rm -rf {} +
          ditto -c -k --keepParent --norsrc Payload out/Poki-unsigned.ipa
          (cd out && shasum -a 256 *.ipa | tee SHA256SUMS)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' Payload/Poki.app/Info.plist
          V=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Payload/Poki.app/Info.plist)
          B=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Payload/Poki.app/Info.plist)
          echo "Poki $V ($B)"; test "$V" = "$MARKETING_VERSION" && test "$B" = "$CURRENT_PROJECT_VERSION"

      # The app on the iOS Simulator: it launches, stays up, and draws its first screen. The launcher
      # cannot reach a simulator's developer services, so this checks the shell, not automation.
      - name: Simulator smoke test
        run: |
          set -euo pipefail
          xcodebuild build \
            -project native/ios-app/Poki.xcodeproj -scheme Poki -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO ARCHS=arm64 MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$CURRENT_PROJECT_VERSION" 2>&1 | tee build/sim.log
          APP=build/sim/Build/Products/Debug-iphonesimulator/Poki.app
          test -d "$APP"
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys;r=[x for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and x["platform"]=="iOS"];print(r[-1]["identifier"])')
          TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys;d=[x for x in json.load(sys.stdin)["devicetypes"] if x["name"].startswith("iPhone") and "Pro" in x["name"] and "Max" not in x["name"]];print(d[-1]["identifier"])')
          UDID=$(xcrun simctl create poki-smoke "$TYPE" "$RUNTIME")
          xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          mkdir -p out/simulator
          xcrun simctl launch "$UDID" nz.zheha.poki
          # Long enough for the first-run disk image download (about 20 MB) to finish.
          alive=1
          for t in $(seq 60); do
            sleep 1
            # Listed to a file first: grep -q in a pipe would end launchctl with SIGPIPE under pipefail.
            xcrun simctl spawn "$UDID" launchctl list > out/simulator/launchctl.txt 2>&1 || true
            grep -q 'nz.zheha.poki' out/simulator/launchctl.txt || { alive=0; echo "Poki is gone after $t s"; break; }
          done
          xcrun simctl io "$UDID" screenshot out/simulator/home.png || true
          ls -la "$(xcrun simctl get_app_container "$UDID" nz.zheha.poki data 2>/dev/null)/Library/Application Support/Poki/ddi" 2>/dev/null || true
          if [ "$alive" = 0 ]; then
            xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "Poki"' --style compact 2>/dev/null | tail -60 || true
            echo "--- crash reports"
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/Poki* 2>/dev/null | head -2); do echo "== $f"; head -120 "$f"; cp "$f" out/simulator/ || true; done
            exit 1
          fi
          echo "Poki ran on the simulator for 60 s"
          # Every screen, light and dark, for the UI check.
          mkdir -p shots
          crashed=0
          for look in light dark; do
            xcrun simctl ui "$UDID" appearance "$look"
            for screen in home setup connect debug activity; do
              xcrun simctl terminate "$UDID" nz.zheha.poki || true
              xcrun simctl launch "$UDID" nz.zheha.poki -pokiScreen "$screen" > /dev/null
              sleep 4
              xcrun simctl io "$UDID" screenshot "shots/$screen-$look.png" > /dev/null
              xcrun simctl spawn "$UDID" launchctl list > out/simulator/launchctl.txt 2>&1 || true
              grep -q 'nz.zheha.poki' out/simulator/launchctl.txt || { echo "::error::Poki died on the $screen screen ($look)"; crashed=1; }
            done
            xcrun simctl terminate "$UDID" nz.zheha.poki || true
            xcrun simctl launch "$UDID" nz.zheha.poki -pokiScreen home -pokiSample YES > /dev/null
            sleep 4
            xcrun simctl io "$UDID" screenshot "shots/home-sample-$look.png" > /dev/null
            xcrun simctl spawn "$UDID" launchctl list > out/simulator/launchctl.txt 2>&1 || true
            grep -q 'nz.zheha.poki' out/simulator/launchctl.txt || { echo "::error::Poki died on the sample home screen ($look)"; crashed=1; }
          done
          ls shots
          # No crash anywhere on the way: any Poki crash report fails the build.
          if ls ~/Library/Logs/DiagnosticReports/Poki* > /dev/null 2>&1; then
            for f in $(ls -t ~/Library/Logs/DiagnosticReports/Poki* | head -2); do echo "== $f"; head -80 "$f"; cp "$f" out/simulator/ || true; done
            crashed=1
          fi
          [ "$crashed" = 0 ] || exit 1

      - uses: actions/upload-artifact@v4
        with:
          name: Poki-0.2.3-selfhost-build5
          retention-days: 7
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-0.2.3-selfhost-build5
          retention-days: 7
          path: |
            out/simulator/
            shots/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-0.2.3-build5-log
          retention-days: 7
          path: build/app.log

  runner:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      PRODUCTS: build/wda/Build/Products/Debug-iphoneos
      RUNNER: WebDriverAgentRunner-Runner.app
    steps:
      - uses: actions/checkout@v4
        with:
          repository: JosssphZhou/poki
          ref: c74303af522e4e496f1fc7b764f1157fb0b80d11
          submodules: true

      - name: Show the toolchain
        run: xcodebuild -version && xcrun --sdk iphoneos --show-sdk-version

      - name: Apply Poki's runner patch (opened by hand it sends people to Poki; its screen while in use)
        run: cd native/ios-runner/WebDriverAgent && git apply < "$GITHUB_WORKSPACE/native/ios-runner/patches/wda-poki-runner.patch" && git diff --stat

      - name: Build for testing (iOS device SDK, unsigned)
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild build-for-testing \
            -project native/ios-runner/WebDriverAgent/WebDriverAgent.xcodeproj \
            -scheme WebDriverAgentRunner \
            -destination generic/platform=iOS \
            -derivedDataPath build/wda \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO \
            ARCHS=arm64 DEBUG_INFORMATION_FORMAT=dwarf | tee build/xcodebuild.log
          test -d "$PRODUCTS/$RUNNER"

      - name: Brand as Poki
        run: native/ios-runner/branding/brand.sh "$PRODUCTS/$RUNNER" docs/images/poki-icon.png docs/images/runner/AppIcon-1024.png

      - name: PokiRunnerHost (opened by hand, the runner starts no test and sends people to Poki)
        run: native/ios-runner/host/install.sh "$PRODUCTS/$RUNNER" iphoneos

      - name: Version (the same version and build number as Poki in a release)
        run: |
          set -euo pipefail
          VERSION="0.2.3"; BUILD="5"
          [ -n "$VERSION" ] || VERSION=$(cat native/ios-app/VERSION 2>/dev/null || echo 0.2.0)
          [ -n "$BUILD" ] || BUILD="${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$PRODUCTS/$RUNNER/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PRODUCTS/$RUNNER/Info.plist"
          echo "Poki Runner $VERSION ($BUILD)"

      - name: Keep the XCTest bundle ID under its host for iLoader
        run: |
          set -euo pipefail
          APP="$PRODUCTS/$RUNNER"
          HOST_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          TEST_PLIST="$APP/PlugIns/WebDriverAgentRunner.xctest/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleIdentifier $HOST_ID.tests" "$TEST_PLIST"
          test "$HOST_ID" = com.facebook.WebDriverAgentRunner.xctrunner
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$TEST_PLIST"

      - name: Package the IPA
        run: |
          set -euo pipefail
          rm -rf Payload out && mkdir -p Payload out
          ditto "$PRODUCTS/$RUNNER" "Payload/$RUNNER"
          find Payload -name '*.dSYM' -prune -exec rm -rf {} +
          # As WebDriverAgent's own real-device package does: the XCTest libraries Xcode copied into the
          # runner come from the phone's developer image instead.
          find "Payload/$RUNNER/Frameworks" -mindepth 1 -maxdepth 1 ! -name libPokiRunnerHost.dylib -exec rm -rf {} +
          ls "Payload/$RUNNER/Frameworks"
          ditto -c -k --keepParent --norsrc Payload out/poki-runner-unsigned.ipa
          # The same runner keeping Xcode's copies, for an install that runs it without the developer image.
          mkdir -p full/Payload && ditto "$PRODUCTS/$RUNNER" "full/Payload/$RUNNER" && find full -name '*.dSYM' -prune -exec rm -rf {} +
          (cd full && ditto -c -k --keepParent --norsrc Payload ../out/poki-runner-unsigned-with-frameworks.ipa)
          (cd out && shasum -a 256 *.ipa | tee SHA256SUMS)
          /usr/libexec/PlistBuddy -c 'Print :CFBundleDisplayName' "Payload/$RUNNER/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "Payload/$RUNNER/Info.plist"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Poki-Runner-0.2.3-build5
          retention-days: 7
          path: out/
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: runner-0.2.3-build5-log
          retention-days: 7
          path: build/xcodebuild.log
