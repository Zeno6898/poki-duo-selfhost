          +
          +async fn remote_probe(text: &str) -> Value {
          +    #[derive(serde::Deserialize)]
          +    struct ProbeConfig { address: std::net::IpAddr, pairing_file: std::path::PathBuf }
          +    let config: ProbeConfig = match serde_json::from_str(text) {
          +        Ok(config) => config,
          +        Err(_) => return serde_json::json!({"ok": false, "address": "", "stage": "config", "detail": "invalid configuration"}),
          +    };
          +    let address = config.address.to_string();
