          +++ b/native/ios-app/Poki/Connect/RelayIdentity.swift
          @@ -16,7 +16,7 @@ struct ConnectorSecret: Codable, Identifiable, Hashable {
           @MainActor
           @Observable
           final class RelayIdentity {
          -    static let relayBase = URL(string: "https://pokimcp.zheha.nz/v1")!
          +    static let relayBase = URL(string: "https://poki-duo-20261107.poki-cf-relay.workers.dev/v1")!
               private static let keyAccount = "relay.ed25519"
               private static let secretsAccount = "relay.secrets"
           
          diff --git a/native/ios-app/Shared/PokiActivityAttributes.swift b/native/ios-app/Shared/PokiActivityAttributes.swift
          index 63eecaf..554ca6f 100644
          --- a/native/ios-app/Shared/PokiActivityAttributes.swift
          +++ b/native/ios-app/Shared/PokiActivityAttributes.swift
          @@ -70,7 +70,20 @@ struct PendingApproval: Codable, Hashable {
           }
           
           enum SharedContainer {
          -    static let appGroup = "group.nz.zheha.poki"
          +    // Sideloaders rewrite App Group IDs. Both the app and widget must use the
          +    // group granted by their signed provisioning profiles, rather than the source ID.
          +    static let appGroup: String = {
          +        let original = "group.nz.zheha.poki"
          +        guard let profileURL = Bundle.main.url(forResource: "embedded", withExtension: "mobileprovision"),
          +              let profile = try? Data(contentsOf: profileURL),
          +              let start = profile.range(of: Data("<plist".utf8)),
          +              let end = profile.range(of: Data("</plist>".utf8), in: start.lowerBound..<profile.endIndex),
          +              let plist = try? PropertyListSerialization.propertyList(from: profile.subdata(in: start.lowerBound..<end.upperBound), format: nil) as? [String: Any],
          +              let entitlements = plist["Entitlements"] as? [String: Any],
          +              let groups = entitlements["com.apple.security.application-groups"] as? [String]
          +        else { return original }
          +        return groups.first { $0 == original || $0.hasPrefix(original + ".") } ?? original
          +    }()
