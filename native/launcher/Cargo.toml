[package]
name = "poki-launcher"
version = "0.1.0"
edition = "2024"
publish = false
license = "AGPL-3.0-only"
description = "Gets the WebDriverAgent runner up on the phone it runs on, and keeps it up (PokiLauncher)."

[lib]
name = "poki_launcher"
crate-type = ["staticlib", "rlib"]

[dependencies]
idevice = { path = "../../.deps/idevice/idevice", default-features = false, features = ["aws-lc", "tcp", "core_device_proxy", "rsd", "tunnel_tcp_stack", "dvt", "installation_proxy", "remote_pairing", "cryptexd", "xctest"] }
tokio = { version = "1.43", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
plist = "1.7"

[dev-dependencies]
tokio = { version = "1.43", features = ["full", "test-util"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
