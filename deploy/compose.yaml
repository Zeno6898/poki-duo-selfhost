# Poki MCP as a 24/7 service.
#   cp deploy/poki.env.example deploy/poki.env   # then edit it
#   docker compose -f deploy/compose.yaml up -d --build
# Host networking lets the daemon reach the phone over the host's tailnet interface and lets
# Tailscale Funnel or cloudflared on this host reach the daemon on 127.0.0.1. Nothing is
# published on a public interface: the daemon binds 127.0.0.1 (POKI_MCP_BIND).
name: poki
services:
  poki-mcp:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: poki-mcp:local
    network_mode: host
    restart: unless-stopped
    env_file: poki.env
    environment:
      POKI_MCP_STATE_DIR: /state
    volumes:
      - ./state:/state
      # Pairing records for the phone, read-only. Never commit these.
      - ${POKI_PAIRING_DIR:-./pairing}:/pairing:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      # 401 means the daemon is up and asking for credentials.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:47825/mcp',{method:'POST'}).then(r=>process.exit(r.status===401?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
